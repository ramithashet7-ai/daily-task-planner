<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Task Planner | Ramitha</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Header -->
        <div class="text-center mb-4">
            <h1>Daily Task Planner</h1>
            <p class="text-muted">
                Plan your day, complete your tasks.
            </p>
        </div>

        <!-- Main Card -->
        <div class="card shadow-sm p-4">

            <!-- Task Statistics -->
            <div class="row text-center mb-4">

                <div class="col-md-4">
                    <h5>Total</h5>
                    <h3 id="totalTasks">0</h3>
                </div>

                <div class="col-md-4">
                    <h5>Completed</h5>
                    <h3 id="completedTasks">0</h3>
                </div>

                <div class="col-md-4">
                    <h5>Pending</h5>
                    <h3 id="pendingTasks">0</h3>
                </div>

            </div>

            <!-- Add Task Area -->
            <div class="task-input-area mb-4">

                <div class="mb-3">
                    <input
                        type="text"
                        id="taskInput"
                        class="form-control"
                        placeholder="Enter a task..."
                    >
                </div>

                <div class="row g-2">

                    <div class="col-md-4">
                        <select id="priorityInput" class="form-select">
                            <option value="Medium">🟡 Medium Priority</option>
                            <option value="High">🔴 High Priority</option>
                            <option value="Low">🟢 Low Priority</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <input
                            type="date"
                            id="dateInput"
                            class="form-control"
                        >
                    </div>

                    <div class="col-md-4">
                        <button
                            id="addTaskButton"
                            class="btn btn-primary w-100"
                        >
                            + Add Task
                        </button>
                    </div>

                </div>

            </div>

            <!-- Task List -->
             <div class="task-filters mb-3 text-center">
    <button id="showAllButton" class="btn btn-sm btn-primary">
        All
    </button>

    <button id="showPendingButton" class="btn btn-sm btn-outline-primary">
        Pending
    </button>

    <button id="showCompletedButton" class="btn btn-sm btn-outline-primary">
        Completed
    </button>
</div>
            <ul id="taskList" class="list-group">
                <!-- Tasks will appear here -->
            </ul>

            <!-- Clear All -->
            <div class="text-center mt-3">
                <button
                    id="clearTasksButton"
                    class="btn btn-outline-danger"
                >
                    Clear All Tasks
                </button>
            </div>

        </div>

    </div>

    <script src="./script.js"></script>

</body>
</html>
